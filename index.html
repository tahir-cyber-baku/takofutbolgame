<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Futbol Oyunu</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    user-select: none;
  }
  body {
    background: #0b3d1f;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: white;
    overflow-x: hidden;
  }
  .container {
    width: 100%;
    max-width: 960px;
    padding: 10px 8px 20px;
    text-align: center;
  }
  h1 {
    font-size: clamp(1.5rem, 5vw, 2.1rem);
    margin-bottom: 10px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  #gameCanvas {
    background: #1a7a3a;
    border: 4px solid #fff;
    border-radius: 10px;
    display: block;
    margin: 0 auto;
    width: 100%;
    max-width: 900px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.4);
  }
  .info {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin: 12px 0 8px;
    flex-wrap: wrap;
  }
  .score-box {
    background: rgba(0,0,0,0.45);
    padding: 7px 18px;
    border-radius: 10px;
    font-size: 1.05rem;
    min-width: 110px;
  }
  #restartBtn {
    margin-top: 6px;
    padding: 11px 28px;
    font-size: 1.05rem;
    background: #ffcc00;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    color: #222;
    cursor: pointer;
  }

  /* Mobil düymələr */
  #mobileControls {
    display: none;
    position: fixed;
    bottom: 16px;
    left: 0;
    right: 0;
    padding: 0 16px;
    z-index: 50;
    pointer-events: none;
  }
  .ctrl-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    max-width: 420px;
    margin: 0 auto;
  }
  .dpad {
    display: grid;
    grid-template-columns: 58px 58px 58px;
    grid-template-rows: 58px 58px 58px;
    gap: 5px;
    pointer-events: auto;
  }
  .dpad button {
    width: 58px;
    height: 58px;
    border: none;
    border-radius: 14px;
    background: rgba(255,255,255,0.22);
    color: white;
    font-size: 22px;
    backdrop-filter: blur(6px);
  }
  .dpad button:active,
  .dpad button.active {
    background: rgba(255,255,255,0.55);
  }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 3; }
  .dpad .empty { visibility: hidden; }

  .kick-btn {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: none;
    background: rgba(220, 50, 50, 0.85);
    color: white;
    font-size: 17px;
    font-weight: 700;
    pointer-events: auto;
    margin-bottom: 18px;
  }
  .kick-btn:active,
  .kick-btn.active {
    background: rgba(255, 30, 30, 1);
    transform: scale(0.94);
  }

  @media (max-width: 768px) {
    #mobileControls { display: block; }
    body { padding-bottom: 170px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>⚽ Futbol Oyunu</h1>
  <canvas id="gameCanvas"></canvas>
  <div class="info">
    <div class="score-box">Sən: <span id="playerScore">0</span></div>
    <div class="score-box">Komputer: <span id="aiScore">0</span></div>
  </div>
  <button id="restartBtn">Yenidən Başla</button>
</div>

<div id="mobileControls">
  <div class="ctrl-row">
    <div class="dpad">
      <div class="empty"></div>
      <button class="up" data-dir="up">▲</button>
      <div class="empty"></div>
      <button class="left" data-dir="left">◀️</button>
      <div class="empty"></div>
      <button class="right" data-dir="right">▶️</button>
      <div class="empty"></div>
      <button class="down" data-dir="down">▼</button>
      <div class="empty"></div>
    </div>
    <button class="kick-btn" id="kickBtn">VUR</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W = 900;
let H = 500;

const player = { x: 150, y: 250, radius: 18, speed: 4.6, color: '#1565c0' };
const ai     = { x: 750, y: 250, radius: 18, speed: 3.5, color: '#c62828' };
const ball   = { x: 450, y: 250, radius: 12, vx: 0, vy: 0, friction: 0.984 };

let playerScore = 0;
let aiScore = 0;
let keys = {};
let touchDirs = { up: false, down: false, left: false, right: false };
let isKicking = false;

// ===== Ölçü düzəltmə (əsas düzəliş buradadır) =====
function resizeCanvas() {
  const maxWidth = Math.min(window.innerWidth - 16, 900);
  const ratio = 500 / 900;
  const cssW = maxWidth;
  const cssH = Math.floor(cssW * ratio);

  // CSS ölçüsü
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';

  // Real piksel ölçüsü (retina üçün)
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);

  // Transformu sıfırla və yenidən tətbiq et (köhnə scale yığılmasın)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  W = cssW;
  H = cssH;

  // Obyektləri sərhəddən kənara çıxarma
  player.x = Math.min(Math.max(player.x, 40), W - 60);
  player.y = Math.min(Math.max(player.y, 30), H - 30);
  ai.x     = Math.min(Math.max(ai.x, W - 180), W - 40);
  ai.y     = Math.min(Math.max(ai.y, 30), H - 30);
  ball.x   = Math.min(Math.max(ball.x, 30), W - 30);
  ball.y   = Math.min(Math.max(ball.y, 30), H - 30);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas(); // ilk dəfə

// ===== İdarəetmə =====
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    isKicking = true;
  }
});
document.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  if (e.code === 'Space') isKicking = false;
});

// Mobil düymələr
document.querySelectorAll('.dpad button').forEach(btn => {
  const dir = btn.dataset.dir;
  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    touchDirs[dir] = true;
    btn.classList.add('active');
  }, { passive: false });
  btn.addEventListener('touchend', e => {
    e.preventDefault();
    touchDirs[dir] = false;
    btn.classList.remove('active');
  }, { passive: false });
  btn.addEventListener('touchcancel', () => {
    touchDirs[dir] = false;
    btn.classList.remove('active');
  });
});

const kickBtn = document.getElementById('kickBtn');
kickBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  isKicking = true;
  kickBtn.classList.add('active');
}, { passive: false });
kickBtn.addEventListener('touchend', e => {
  e.preventDefault();
  isKicking = false;
  kickBtn.classList.remove('active');
}, { passive: false });
kickBtn.addEventListener('touchcancel', () => {
  isKicking = false;
  kickBtn.classList.remove('active');
});

document.getElementById('restartBtn').addEventListener('click', restartGame);

// ===== Çəkmə =====
function drawField() {
  ctx.fillStyle = '#1a7a3a';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 3;

  // Orta dairə
  ctx.beginPath();
  ctx.arc(W/2, H/2, Math.min(65, H*0.13), 0, Math.PI*2);
  ctx.stroke();

  // Orta xətt
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();

  // Qapılar
  const goalH = H * 0.28;
  const goalY = (H - goalH) / 2;

  ctx.fillStyle = 'rgba(255,255,255,0.13)';
  ctx.fillRect(0, goalY, 20, goalH);
  ctx.strokeRect(0, goalY, 20, goalH);

  ctx.fillRect(W-20, goalY, 20, goalH);
  ctx.strokeRect(W-20, goalY, 20, goalH);

  // Cərimə sahələri
  ctx.strokeRect(0, goalY-35, 75, goalH+70);
  ctx.strokeRect(W-75, goalY-35, 75, goalH+70);
}

function drawCircle(obj) {
  ctx.beginPath();
  ctx.arc(obj.x, obj.y, obj.radius, 0, Math.PI*2);
  ctx.fillStyle = obj.color || '#fff';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawPlayer(p) {
  drawCircle(p);
  // Gözlər
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(p.x - 5, p.y - 4, 3, 0, Math.PI*2);
  ctx.arc(p.x + 5, p.y - 4, 3, 0, Math.PI*2);
  ctx.fill();
}

function drawBall() {
  drawCircle(ball);
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius*0.55, 0, Math.PI*2);
  ctx.strokeStyle = '#222';
  ctx.stroke();
}

// ===== Fizika =====
function collide(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return Math.hypot(dx, dy) < a.radius + b.radius;
}

function kick(p) {
  if (collide(p, ball)) {
    const angle = Math.atan2(ball.y - p.y, ball.x - p.x);
    ball.vx = Math.cos(angle) * 9.8;
    ball.vy = Math.sin(angle) * 9.8;
  }
}

function updatePlayer() {
  const left  = keys['arrowleft']  || keys['a'] || touchDirs.left;
  const right = keys['arrowright'] || keys['d'] || touchDirs.right;
  const up    = keys['arrowup']    || keys['w'] || touchDirs.up;
  const down  = keys['arrowdown']  || keys['s'] || touchDirs.down;

  if (left)  player.x -= player.speed;
  if (right) player.x += player.speed;
  if (up)    player.y -= player.speed;
  if (down)  player.y += player.speed;

  player.x = Math.max(player.radius+3, Math.min(W-player.radius-25, player.x));
  player.y = Math.max(player.radius+3, Math.min(H-player.radius-3, player.y));

  if (isKicking || keys[' '] || keys['space']) kick(player);
}

function updateAI() {
  if (ai.y < ball.y - 8) ai.y += ai.speed;
  if (ai.y > ball.y + 8) ai.y -= ai.speed;

  if (ball.x > W * 0.55) {
    if (ai.x > ball.x + 20) ai.x -= ai.speed;
    if (ai.x < ball.x - 20) ai.x += ai.speed;
  } else {
    if (ai.x < W - 160) ai.x += ai.speed * 0.5;
    if (ai.x > W - 100) ai.x -= ai.speed * 0.5;
  }

  ai.x = Math.max(ai.radius+20, Math.min(W-ai.radius-5, ai.x));
  ai.y = Math.max(ai.radius+3, Math.min(H-ai.radius-3, ai.y));

  if (collide(ai, ball) && Math.random() > 0.4) {
    const angle = Math.atan2(ball.y - ai.y, ball.x - ai.x);
    ball.vx = Math.cos(angle) * 7.6;
    ball.vy = Math.sin(angle) * 7.6;
  }
}

function updateBall() {
  ball.x += ball.vx;
  ball.y += ball.vy;
  ball.vx *= ball.friction;
  ball.vy *= ball.friction;

  // Yuxarı / aşağı
  if (ball.y < ball.radius || ball.y > H - ball.radius) {
    ball.vy *= -0.82;
    ball.y = Math.max(ball.radius, Math.min(H - ball.radius, ball.y));
  }

  const goalH = H * 0.28;
  const goalY = (H - goalH) / 2;

  // Sol (AI qolu)
  if (ball.x < ball.radius) {
    if (ball.y > goalY && ball.y < goalY + goalH) {
      aiScore++;
      document.getElementById('aiScore').textContent = aiScore;
      resetPositions();
    } else {
      ball.vx *= -0.82;
      ball.x = ball.radius;
    }
  }

  // Sağ (sənin qolun)
  if (ball.x > W - ball.radius) {
    if (ball.y > goalY && ball.y < goalY + goalH) {
      playerScore++;
      document.getElementById('playerScore').textContent = playerScore;
      resetPositions();
    } else {
      ball.vx *= -0.82;
      ball.x = W - ball.radius;
    }
  }

  // Oyunçu ilə toqquşma
  if (collide(player, ball)) {
    const angle = Math.atan2(ball.y - player.y, ball.x - player.x);
    const speed = Math.hypot(ball.vx, ball.vy) * 0.3 + 2.3;
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
  }
}

function resetPositions() {
  ball.x = W / 2;
  ball.y = H / 2;
  ball.vx = (Math.random() > 0.5 ? 1 : -1) * 3.5;
  ball.vy = (Math.random() - 0.5) * 4;
  player.x = 150;
  player.y = H / 2;
  ai.x = W - 150;
  ai.y = H / 2;
}

function restartGame() {
  playerScore = 0;
  aiScore = 0;
  document.getElementById('playerScore').textContent = 0;
  document.getElementById('aiScore').textContent = 0;
  resetPositions();
}

// ===== Əsas döngü =====
function gameLoop() {
  drawField();
  updatePlayer();
  updateAI();
  updateBall();
  drawPlayer(player);
  drawPlayer(ai);
  drawBall();

  if (playerScore >= 5 || aiScore >= 5) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffcc00';
    ctx.font = bold ${Math.min(40, W*0.07)}px Arial;
    ctx.textAlign = 'center';
    ctx.fillText(playerScore >= 5 ? 'Sən Qalib Gəldin! 🎉' : 'Komputer Qalib Gəldi', W/2, H/2 - 10);
    ctx.fillStyle = '#fff';
    ctx.font = ${Math.min(18, W*0.04)}px Arial;
    ctx.fillText('Yenidən oynamaq üçün düyməyə bas', W/2, H/2 + 30);
  }

  requestAnimationFrame(gameLoop);
}

resetPositions();
gameLoop();
</script>
</body>
</html>
