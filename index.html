<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Futbol Oyunu</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none}
  body{background:#0b3d1f;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow-x:hidden}
  .container{width:100%;max-width:960px;padding:10px 8px 20px;text-align:center}
  h1{font-size:clamp(1.5rem,5vw,2.1rem);margin-bottom:10px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
  #gameCanvas{background:#1a7a3a;border:4px solid #fff;border-radius:10px;display:block;margin:0 auto;width:100%;max-width:900px;box-shadow:0 8px 25px rgba(0,0,0,.4)}
  .info{display:flex;justify-content:center;gap:14px;margin:12px 0 8px;flex-wrap:wrap}
  .score-box{background:rgba(0,0,0,.45);padding:7px 18px;border-radius:10px;font-size:1.05rem;min-width:110px}
  #restartBtn{margin-top:6px;padding:11px 28px;font-size:1.05rem;background:#ffcc00;border:none;border-radius:10px;font-weight:700;color:#222;cursor:pointer}

  #mobileControls{display:none;position:fixed;bottom:16px;left:0;right:0;padding:0 16px;z-index:50;pointer-events:none}
  .ctrl-row{display:flex;justify-content:space-between;align-items:flex-end;max-width:420px;margin:0 auto}
  .dpad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px 58px;gap:5px;pointer-events:auto}
  .dpad button{width:58px;height:58px;border:none;border-radius:14px;background:rgba(255,255,255,.22);color:#fff;font-size:22px;backdrop-filter:blur(6px)}
  .dpad button:active,.dpad button.active{background:rgba(255,255,255,.55)}
  .dpad .up{grid-column:2;grid-row:1}
  .dpad .left{grid-column:1;grid-row:2}
  .dpad .right{grid-column:3;grid-row:2}
  .dpad .down{grid-column:2;grid-row:3}
  .dpad .empty{visibility:hidden}
  .kick-btn{width:78px;height:78px;border-radius:50%;border:none;background:rgba(220,50,50,.85);color:#fff;font-size:17px;font-weight:700;pointer-events:auto;margin-bottom:18px}
  .kick-btn:active,.kick-btn.active{background:rgba(255,30,30,1);transform:scale(.94)}

  @media(max-width:768px){#mobileControls{display:block}body{padding-bottom:170px}}
</style>
</head>
<body>
<div class="container">
  <h1>⚽ Futbol Oyunu</h1>
  <canvas id="gameCanvas"></canvas>
  <div class="info">
    <div class="score-box">Sən: <span id="playerScore">0</span></div>
    <div class="score-box">Komputer: <span id="aiScore">0</span></div>
  </div>
  <button id="restartBtn">Yenidən Başla</button>
</div>

<div id="mobileControls">
  <div class="ctrl-row">
    <div class="dpad">
      <div class="empty"></div>
      <button class="up" data-dir="up">▲</button>
      <div class="empty"></div>
      <button class="left" data-dir="left">◀️</button>
      <div class="empty"></div>
      <button class="right" data-dir="right">▶️</button>
      <div class="empty"></div>
      <button class="down" data-dir="down">▼</button>
      <div class="empty"></div>
    </div>
    <button class="kick-btn" id="kickBtn">VUR</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W = 900, H = 500;

const player = { x: 0, y: 0, radius: 17, speed: 4.5, color: '#1565c0' };
const ai     = { x: 0, y: 0, radius: 17, speed: 3.4, color: '#c62828' };
const ball   = { x: 0, y: 0, radius: 11, vx: 0, vy: 0, friction: 0.984 };

let playerScore = 0, aiScore = 0;
let keys = {};
let touchDirs = { up:false, down:false, left:false, right:false };
let isKicking = false;

// ===== Ölçünü düzgün qur =====
function resizeCanvas() {
  const maxW = Math.min(window.innerWidth - 16, 900);
  const cssW = maxW;
  const cssH = Math.floor(cssW * (500/900));

  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';

  const dpr = window.devicePixelRatio || 1;
  canvas.width  = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // köhnə scale yığılmasın

  W = cssW;
  H = cssH;
}

// ===== Oyunçuları və topu həmişə görünən yerə qoy =====
function placeObjects() {
  player.x = W * 0.18;
  player.y = H / 2;

  ai.x = W * 0.82;
  ai.y = H / 2;

  ball.x = W / 2;
  ball.y = H / 2;
  ball.vx = (Math.random() > 0.5 ? 1 : -1) * 3.2;
  ball.vy = (Math.random() - 0.5) * 3.5;
}

window.addEventListener('resize', () => {
  resizeCanvas();
  placeObjects();
});

// İlk dəfə
resizeCanvas();
placeObjects();

// ===== İdarəetmə =====
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space') { e.preventDefault(); isKicking = true; }
});
document.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  if (e.code === 'Space') isKicking = false;
});

document.querySelectorAll('.dpad button').forEach(btn => {
  const dir = btn.dataset.dir;
  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    touchDirs[dir] = true;
    btn.classList.add('active');
  }, {passive:false});
  btn.addEventListener('touchend', e => {
    e.preventDefault();
    touchDirs[dir] = false;
    btn.classList.remove('active');
  }, {passive:false});
  btn.addEventListener('touchcancel', () => {
    touchDirs[dir] = false;
    btn.classList.remove('active');
  });
});

const kickBtn = document.getElementById('kickBtn');
kickBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  isKicking = true;
  kickBtn.classList.add('active');
}, {passive:false});
kickBtn.addEventListener('touchend', e => {
  e.preventDefault();
  isKicking = false;
  kickBtn.classList.remove('active');
}, {passive:false});
kickBtn.addEventListener('touchcancel', () => {
  isKicking = false;
  kickBtn.classList.remove('active');
});

document.getElementById('restartBtn').onclick = () => {
  playerScore = 0;
  aiScore = 0;
  document.getElementById('playerScore').textContent = 0;
  document.getElementById('aiScore').textContent = 0;
  placeObjects();
};

// ===== Çəkmə =====
function drawField() {
  ctx.fillStyle = '#1a7a3a';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 2.5;

  // Orta dairə
  ctx.beginPath();
  ctx.arc(W/2, H/2, Math.min(55, H*0.12), 0, Math.PI*2);
  ctx.stroke();

  // Orta xətt
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();

  // Qapılar
  const goalH = H * 0.30;
  const goalY = (H - goalH) / 2;

  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(0, goalY, 18, goalH);
  ctx.strokeRect(0, goalY, 18, goalH);

  ctx.fillRect(W-18, goalY, 18, goalH);
  ctx.strokeRect(W-18, goalY, 18, goalH);

  // Cərimə sahələri
  ctx.strokeRect(0, goalY-30, 65, goalH+60);
  ctx.strokeRect(W-65, goalY-30, 65, goalH+60);
}

function drawPlayer(p) {
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
  ctx.fillStyle = p.color;
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Gözlər
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(p.x-4, p.y-3, 2.5, 0, Math.PI*2);
  ctx.arc(p.x+4, p.y-3, 2.5, 0, Math.PI*2);
  ctx.fill();
}

function drawBall() {
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius*0.55, 0, Math.PI*2);
  ctx.stroke();
}

// ===== Fizika =====
function collide(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y) < a.radius + b.radius;
}

function kick(p) {
  if (collide(p, ball)) {
    const ang = Math.atan2(ball.y - p.y, ball.x - p.x);
    ball.vx = Math.cos(ang) * 9.5;
    ball.vy = Math.sin(ang) * 9.5;
  }
}

function updatePlayer() {
  const left  = keys['arrowleft']  || keys['a'] || touchDirs.left;
  const right = keys['arrowright'] || keys['d'] || touchDirs.right;
  const up    = keys['arrowup']    || keys['w'] || touchDirs.up;
  const down  = keys['arrowdown']  || keys['s'] || touchDirs.down;

  if (left)  player.x -= player.speed;
  if (right) player.x += player.speed;
  if (up)    player.y -= player.speed;
  if (down)  player.y += player.speed;

  player.x = Math.max(player.radius+2, Math.min(W - player.radius - 20, player.x));
  player.y = Math.max(player.radius+2, Math.min(H - player.radius - 2, player.y));

  if (isKicking || keys[' '] || keys['space']) kick(player);
}

function updateAI() {
  if (ai.y < ball.y - 7) ai.y += ai.speed;
  if (ai.y > ball.y + 7) ai.y -= ai.speed;

  if (ball.x > W * 0.55) {
    if (ai.x > ball.x + 18) ai.x -= ai.speed;
    if (ai.x < ball.x - 18) ai.x += ai.speed;
  } else {
    if (ai.x < W - 140) ai.x += ai.speed * 0.45;
    if (ai.x > W - 90)  ai.x -= ai.speed * 0.45;
  }

  ai.x = Math.max(ai.radius+15, Math.min(W - ai.radius - 4, ai.x));
  ai.y = Math.max(ai.radius+2, Math.min(H - ai.radius - 2, ai.y));

  if (collide(ai, ball) && Math.random() > 0.42) {
    const ang = Math.atan2(ball.y - ai.y, ball.x - ai.x);
    ball.vx = Math.cos(ang) * 7.4;
    ball.vy = Math.sin(ang) * 7.4;
  }
}

function updateBall() {
  ball.x += ball.vx;
  ball.y += ball.vy;
  ball.vx *= ball.friction;
  ball.vy *= ball.friction;

  if (ball.y < ball.radius || ball.y > H - ball.radius) {
    ball.vy *= -0.8;
    ball.y = Math.max(ball.radius, Math.min(H - ball.radius, ball.y));
  }

  const goalH = H * 0.30;
  const goalY = (H - goalH) / 2;

  // Sol qapı (AI qolu)
  if (ball.x < ball.radius) {
    if (ball.y > goalY && ball.y < goalY + goalH) {
      aiScore++;
      document.getElementById('aiScore').textContent = aiScore;
      placeObjects();
    } else {
      ball.vx *= -0.8;
      ball.x = ball.radius;
    }
  }

  // Sağ qapı (sənin qolun)
  if (ball.x > W - ball.radius) {
    if (ball.y > goalY && ball.y < goalY + goalH) {
      playerScore++;
      document.getElementById('playerScore').textContent = playerScore;
      placeObjects();
    } else {
      ball.vx *= -0.8;
      ball.x = W - ball.radius;
    }
  }

  if (collide(player, ball)) {
    const ang = Math.atan2(ball.y - player.y, ball.x - player.x);
    const spd = Math.hypot(ball.vx, ball.vy) * 0.28 + 2.1;
    ball.vx = Math.cos(ang) * spd;
    ball.vy = Math.sin(ang) * spd;
  }
}

// ===== Əsas döngü =====
function gameLoop() {
  drawField();
  updatePlayer();
  updateAI();
  updateBall();
  drawPlayer(player);
  drawPlayer(ai);
  drawBall();

  if (playerScore >= 5 || aiScore >= 5) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffcc00';
    ctx.font = bold ${Math.min(36, W*0.07)}px Arial;
    ctx.textAlign = 'center';
    ctx.fillText(playerScore >= 5 ? 'Sən Qalib Gəldin! 🎉' : 'Komputer Qalib Gəldi', W/2, H/2 - 8);
    ctx.fillStyle = '#fff';
    ctx.font = ${Math.min(16, W*0.04)}px Arial;
    ctx.fillText('Yenidən oynamaq üçün düyməyə bas', W/2, H/2 + 26);
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
