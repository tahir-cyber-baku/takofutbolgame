<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Futbol Oyunu - Mobil & PC</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  body {
    background: #0a3d1f;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: white;
    overflow: hidden;
    user-select: none;
  }
  .container {
    width: 100%;
    max-width: 960px;
    text-align: center;
    padding: 8px;
  }
  h1 {
    margin-bottom: 6px;
    text-shadow: 2px 2px 4px #000;
    font-size: clamp(1.4rem, 5vw, 2.2rem);
  }
  #gameCanvas {
    background: #1a7a3a;
    border: 4px solid #fff;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    display: block;
    margin: 0 auto;
    width: 100%;
    max-width: 900px;
    height: auto;
    touch-action: none;
  }
  .info {
    margin-top: 10px;
    font-size: clamp(0.95rem, 3.5vw, 1.15rem);
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .score-box {
    background: rgba(0,0,0,0.45);
    padding: 6px 16px;
    border-radius: 8px;
    min-width: 100px;
  }
  .controls-text {
    margin-top: 8px;
    font-size: 0.85rem;
    opacity: 0.8;
  }
  button#restartBtn {
    margin-top: 10px;
    padding: 10px 24px;
    font-size: 1rem;
    background: #ffcc00;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    color: #222;
  }

  /* ===== Mobil virtual düymələr ===== */
  #mobileControls {
    display: none;
    position: fixed;
    bottom: 12px;
    left: 0;
    right: 0;
    padding: 0 12px;
    z-index: 100;
    pointer-events: none;
  }
  .ctrl-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    max-width: 480px;
    margin: 0 auto;
  }
  .dpad {
    display: grid;
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 56px 56px 56px;
    gap: 4px;
    pointer-events: auto;
  }
  .dpad button {
    width: 56px;
    height: 56px;
    border: none;
    border-radius: 12px;
    background: rgba(255,255,255,0.25);
    color: white;
    font-size: 22px;
    font-weight: bold;
    backdrop-filter: blur(4px);
  }
  .dpad button:active,
  .dpad button.active {
    background: rgba(255,255,255,0.55);
  }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 3; }
  .dpad .empty { visibility: hidden; }

  .kick-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 80, 80, 0.7);
    color: white;
    font-size: 18px;
    font-weight: bold;
    pointer-events: auto;
    margin-bottom: 20px;
  }
  .kick-btn:active,
  .kick-btn.active {
    background: rgba(255, 40, 40, 0.95);
    transform: scale(0.95);
  }

  @media (max-width: 768px) {
    #mobileControls {
      display: block;
    }
    .controls-text {
      display: none;
    }
    body {
      padding-bottom: 160px;
    }
  }
</style>
</head>
<body>
<div class="container">
  <h1>⚽ Futbol Oyunu</h1>
  <canvas id="gameCanvas" width="900" height="500"></canvas>
  <div class="info">
    <div class="score-box">Sən: <span id="playerScore">0</span></div>
    <div class="score-box">Komputer: <span id="aiScore">0</span></div>
  </div>
  <div class="controls-text">
    Klaviatura: ← → ↑ ↓ / WASD + Space (vurmaq)
  </div>
  <button id="restartBtn" onclick="restartGame()">Yenidən Başla</button>
</div>

<!-- Mobil düymələr -->
<div id="mobileControls">
  <div class="ctrl-row">
    <div class="dpad">
      <div class="empty"></div>
      <button class="up" data-dir="up">▲</button>
      <div class="empty"></div>
      <button class="left" data-dir="left">◀️</button>
      <div class="empty"></div>
      <button class="right" data-dir="right">▶️</button>
      <div class="empty"></div>
      <button class="down" data-dir="down">▼</button>
      <div class="empty"></div>
    </div>
    <button class="kick-btn" id="kickBtn">VUR</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W = canvas.width;
let H = canvas.height;

// Oyun obyektləri
const player = {
  x: 150,
  y: H / 2,
  radius: 18,
  speed: 4.5,
  color: '#1565c0'
};

const ai = {
  x: W - 150,
  y: H / 2,
  radius: 18,
  speed: 3.4,
  color: '#c62828'
};

const ball = {
  x: W / 2,
  y: H / 2,
  radius: 12,
  vx: 0,
  vy: 0,
  friction: 0.985
};

let playerScore = 0;
let aiScore = 0;
let keys = {};
let touchDirs = { up: false, down: false, left: false, right: false };
let isKicking = false;

// ===== Klaviatura =====
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    isKicking = true;
  }
});
document.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  if (e.code === 'Space') isKicking = false;
});

// ===== Mobil toxunma düymələri =====
const dpadButtons = document.querySelectorAll('.dpad button');
const kickBtn = document.getElementById('kickBtn');

function setDir(dir, state) {
  touchDirs[dir] = state;
  const btn = document.querySelector(.dpad .${dir});
  if (btn) btn.classList.toggle('active', state);
}

dpadButtons.forEach(btn => {
  const dir = btn.dataset.dir;
  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    setDir(dir, true);
  }, { passive: false });
  btn.addEventListener('touchend', e => {
    e.preventDefault();
    setDir(dir, false);
  }, { passive: false });
  btn.addEventListener('touchcancel', () => setDir(dir, false));
});

kickBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  isKicking = true;
  kickBtn.classList.add('active');
}, { passive: false });
kickBtn.addEventListener('touchend', e => {
  e.preventDefault();
  isKicking = false;
  kickBtn.classList.remove('active');
}, { passive: false });
kickBtn.addEventListener('touchcancel', () => {
  isKicking = false;
  kickBtn.classList.remove('active');
});

// ===== Canvas ölçüsünü uyğunlaşdır =====
function resizeCanvas() {
  const maxW = Math.min(window.innerWidth - 16, 900);
  const ratio = 500 / 900;
  const newW = maxW;
  const newH = Math.floor(newW * ratio);

  canvas.style.width = newW + 'px';
  canvas.style.height = newH + 'px';

  // Daxili həll (keyfiyyət üçün)
  const scale = window.devicePixelRatio || 1;
  canvas.width = newW * scale;
  canvas.height = newH * scale;
  ctx.scale(scale, scale);

  W = newW;
  H = newH;

  // Obyektləri yenidən yerləşdir
  player.x = Math.min(player.x, W - 40);
  ai.x = Math.max(ai.x, W - 180);
  ball.x = Math.min(ball.x, W - 20);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ===== Çəkmə funksiyaları =====
function drawField() {
  ctx.fillStyle = '#1a7a3a';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 3;

  // Orta dairə
  ctx.beginPath();
  ctx.arc(W/2, H/2, Math.min(70, H*0.14), 0, Math.PI*2);
  ctx.stroke();

  // Orta xətt
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();

  // Qapılar
  const goalH = H * 0.28;
  const goalY = (H - goalH) / 2;

  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(0, goalY, 22, goalH);
  ctx.strokeRect(0, goalY, 22, goalH);

  ctx.fillRect(W - 22, goalY, 22, goalH);
  ctx.strokeRect(W - 22, goalY, 22, goalH);

  // Cərimə sahələri
  ctx.strokeRect(0, goalY - 40, 80, goalH + 80);
  ctx.strokeRect(W - 80, goalY - 40, 80, goalH + 80);
}

function drawPlayer(p) {
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
  ctx.fillStyle = p.color;
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Gözlər
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(p.x - 5, p.y - 4, 3, 0, Math.PI*2);
  ctx.arc(p.x + 5, p.y - 4, 3, 0, Math.PI*2);
  ctx.fill();
}

function drawBall() {
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius * 0.55, 0, Math.PI*2);
  ctx.stroke();
}

// ===== Fizika =====
function collide(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return Math.sqrt(dx*dx + dy*dy) < a.radius + b.radius;
}

function kickBall(p) {
  if (collide(p, ball)) {
    const angle = Math.atan2(ball.y - p.y, ball.x - p.x);
    const power = 9.5;
    ball.vx = Math.cos(angle) * power;
    ball.vy = Math.sin(angle) * power;
  }
}

function updateAI() {
  const targetY = ball.y;
  if (ai.y < targetY - 6) ai.y += ai.speed;
  if (ai.y > targetY + 6) ai.y -= ai.speed;

  if (ball.x > W * 0.55) {
    if (ai.x > ball.x + 25) ai.x -= ai.speed;
    if (ai.x < ball.x - 25) ai.x += ai.speed;
  } else {
    if (ai.x < W - 170) ai.x += ai.speed * 0.55;
    if (ai.x > W - 110) ai.x -= ai.speed * 0.55;
  }

  ai.x = Math.max(ai.radius + 25, Math.min(W - ai.radius - 8, ai.x));
  ai.y = Math.max(ai.radius + 4, Math.min(H - ai.radius - 4, ai.y));

  if (collide(ai, ball) && Math.random() > 0.38) {
    const angle = Math.atan2(ball.y - ai.y, ball.x - ai.x);
    ball.vx = Math.cos(angle) * 7.8;
    ball.vy = Math.sin(angle) * 7.8;
  }
}

function updatePlayer() {
  const left  = keys['arrowleft']  || keys['a'] || touchDirs.left;
  const right = keys['arrowright'] || keys['d'] || touchDirs.right;
  const up    = keys['arrowup']    || keys['w'] || touchDirs.up;
  const down  = keys['arrowdown']  || keys['s'] || touchDirs.down;

  if (left)  player.x -= player.speed;
  if (right) player.x += player.speed;
  if (up)    player.y -= player.speed;
  if (down)  player.y += player.speed;

  player.x = Math.max(player.radius + 4, Math.min(W - player.radius - 25, player.x));
  player.y = Math.max(player.radius + 4, Math.min(H - player.radius - 4, player.y));

  if (isKicking || keys[' '] || keys['space']) {
    kickBall(player);
  }
}

function updateBall() {
  ball.x += ball.vx;
  ball.y += ball.vy;
  ball.vx *= ball.friction;
  ball.vy *= ball.friction;

  // Yuxarı / aşağı
  if (ball.y - ball.radius < 0 || ball.y + ball.radius > H) {
    ball.vy *= -0.82;
    ball.y = Math.max(ball.radius, Math.min(H - ball.radius, ball.y));
  }

  const goalH = H * 0.28;
  const goalY = (H - goalH) / 2;

  // Sol divar
  if (ball.x - ball.radius < 0) {
    if (ball.y > goalY && ball.y < goalY + goalH) {
      aiScore++;
      document.getElementById('aiScore').textContent = aiScore;
      resetBall();
    } else {
      ball.vx *= -0.82;
      ball.x = ball.radius;
    }
  }

  // Sağ divar
  if (ball.x + ball.radius > W) {
    if (ball.y > goalY && ball.y < goalY + goalH) {
      playerScore++;
      document.getElementById('playerScore').textContent = playerScore;
      resetBall();
    } else {
      ball.vx *= -0.82;
      ball.x = W - ball.radius;
    }
  }

  // Oyunçu ilə toqquşma
  if (collide(player, ball)) {
    const angle = Math.atan2(ball.y - player.y, ball.x - player.x);
    const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy) * 0.28 + 2.2;
    ball.vx = Math.cos(angle) * speed;
    ball.vy = Math.sin(angle) * speed;
  }
}

function resetBall() {
  ball.x = W / 2;
  ball.y = H / 2;
  ball.vx = (Math.random() > 0.5 ? 1 : -1) * 3.2;
  ball.vy = (Math.random() - 0.5) * 4;
}

function restartGame() {
  playerScore = 0;
  aiScore = 0;
  document.getElementById('playerScore').textContent = 0;
  document.getElementById('aiScore').textContent = 0;
  player.x = 150;
  player.y = H / 2;
  ai.x = W - 150;
  ai.y = H / 2;
  resetBall();
}

// ===== Əsas döngü =====
function gameLoop() {
  // Ölçüləri yenilə (bəzən lazım olur)
  if (canvas.width / (window.devicePixelRatio || 1) !== W) {
    resizeCanvas();
  }

  drawField();
  updatePlayer();
  updateAI();
  updateBall();
  drawPlayer(player);
  drawPlayer(ai);
  drawBall();

  // Qələbə
  if (playerScore >= 5 || aiScore >= 5) {
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffcc00';
    ctx.font = bold ${Math.min(42, W*0.07)}px Arial;
    ctx.textAlign = 'center';
    ctx.fillText(
      playerScore >= 5 ? 'Sən Qalib Gəldin! 🎉' : 'Komputer Qalib Gəldi',
      W/2, H/2 - 15
    );
    ctx.font = ${Math.min(20, W*0.04)}px Arial;
    ctx.fillStyle = '#fff';
    ctx.fillText('Yenidən oynamaq üçün düyməyə bas', W/2, H/2 + 25);
  }

  requestAnimationFrame(gameLoop);
}

resetBall();
gameLoop();
</script>
</body>
</html>
