<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Futbol Oyunu</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none}
  body{background:#0b3d1f;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Arial,sans-serif;color:white;overflow-x:hidden}
  h1{margin:12px 0;font-size:1.7rem}
  #c{background:#1a7a3a;border:4px solid #fff;border-radius:8px;display:block;max-width:100%}
  .info{display:flex;gap:16px;margin:12px 0}
  .score{background:rgba(0,0,0,.5);padding:8px 18px;border-radius:8px}
  button{padding:10px 24px;font-size:1.05rem;background:#ffcc00;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-bottom:8px}
  #ctrl{display:none;position:fixed;bottom:18px;left:0;right:0;justify-content:space-around;align-items:flex-end;padding:0 18px;pointer-events:none}
  .pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px 58px;gap:5px;pointer-events:auto}
  .pad button{width:58px;height:58px;border-radius:12px;background:rgba(255,255,255,.28);border:none;color:#fff;font-size:22px}
  .u{grid-column:2;grid-row:1}.l{grid-column:1;grid-row:2}.r{grid-column:3;grid-row:2}.d{grid-column:2;grid-row:3}
  .e{visibility:hidden}
  #kick{width:76px;height:76px;border-radius:50%;background:#e53935;border:none;color:#fff;font-size:16px;font-weight:bold;pointer-events:auto}
  @media(max-width:768px){#ctrl{display:flex}body{padding-bottom:170px}}
</style>
</head>
<body>
<h1>⚽ Futbol Oyunu</h1>
<canvas id="c" width="800" height="450"></canvas>
<div class="info">
  <div class="score">Sən: <span id="ps">0</span></div>
  <div class="score">Komputer: <span id="as">0</span></div>
</div>
<button onclick="restart()">Yenidən Başla</button>

<div id="ctrl">
  <div class="pad">
    <div class="e"></div><button class="u" id="up">▲</button><div class="e"></div>
    <button class="l" id="left">◀️</button><div class="e"></div><button class="r" id="right">▶️</button>
    <div class="e"></div><button class="d" id="down">▼</button><div class="e"></div>
  </div>
  <button id="kick">VUR</button>
</div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W = 800, H = 450;

let pl = {x:140, y:225, r:18, s:5, col:'#1976d2'};
let ai = {x:660, y:225, r:18, s:3.6, col:'#d32f2f'};
let b  = {x:400, y:225, r:12, vx:0, vy:0};
let ps=0, as=0;
let key={}, tch={u:0,d:0,l:0,r:0,k:0};

function resize(){
  const mw = Math.min(window.innerWidth-16, 900);
  W = mw; H = Math.floor(mw*0.56);
  c.width = W; c.height = H;
  pl.x = W*0.18; pl.y = H/2;
  ai.x = W*0.82; ai.y = H/2;
  b.x = W/2; b.y = H/2;
}
window.addEventListener('resize', resize);
resize();

document.onkeydown = e => { key[e.key]=1; if(e.code==='Space') e.preventDefault(); };
document.onkeyup   = e => key[e.key]=0;

['up','down','left','right'].forEach(id=>{
  const el=document.getElementById(id);
  el.ontouchstart = e=>{e.preventDefault(); tch[id[0]]=1;};
  el.ontouchend   = e=>{e.preventDefault(); tch[id[0]]=0;};
});
document.getElementById('kick').ontouchstart = e=>{e.preventDefault(); tch.k=1;};
document.getElementById('kick').ontouchend   = e=>{e.preventDefault(); tch.k=0;};

function draw(){
  // sahə
  ctx.fillStyle='#1a7a3a';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.85)';
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,55,0,7); ctx.stroke();
  const gh=H*0.3, gy=(H-gh)/2;
  ctx.strokeRect(0,gy,18,gh);
  ctx.strokeRect(W-18,gy,18,gh);

  // oyunçu
  ctx.beginPath(); ctx.arc(pl.x,pl.y,pl.r,0,7);
  ctx.fillStyle=pl.col; ctx.fill(); ctx.strokeStyle='#fff'; ctx.stroke();

  // AI
  ctx.beginPath(); ctx.arc(ai.x,ai.y,ai.r,0,7);
  ctx.fillStyle=ai.col; ctx.fill(); ctx.stroke();

  // top
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7);
  ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#222'; ctx.stroke();
}

function update(){
  if(key.ArrowLeft||key.a||key.A||tch.l) pl.x-=pl.s;
  if(key.ArrowRight||key.d||key.D||tch.r) pl.x+=pl.s;
  if(key.ArrowUp||key.w||key.W||tch.u) pl.y-=pl.s;
  if(key.ArrowDown||key.s||key.S||tch.d) pl.y+=pl.s;
  pl.x=Math.max(pl.r,Math.min(W-pl.r-25,pl.x));
  pl.y=Math.max(pl.r,Math.min(H-pl.r,pl.y));

  if(key[' ']||tch.k){
    const dx=b.x-pl.x, dy=b.y-pl.y, d=Math.hypot(dx,dy);
    if(d<pl.r+b.r+8){ const a=Math.atan2(dy,dx); b.vx=Math.cos(a)*11; b.vy=Math.sin(a)*11; }
  }

  if(ai.y<b.y-8) ai.y+=ai.s;
  if(ai.y>b.y+8) ai.y-=ai.s;
  if(b.x>W*0.55){ if(ai.x>b.x+15)ai.x-=ai.s; if(ai.x<b.x-15)ai.x+=ai.s; }
  ai.x=Math.max(W*0.55,Math.min(W-ai.r-8,ai.x));
  ai.y=Math.max(ai.r,Math.min(H-ai.r,ai.y));

  const adx=b.x-ai.x, ady=b.y-ai.y;
  if(Math.hypot(adx,ady)<ai.r+b.r+4){ const a=Math.atan2(ady,adx); b.vx=Math.cos(a)*8; b.vy=Math.sin(a)*8; }

  b.x+=b.vx; b.y+=b.vy;
  b.vx*=0.984; b.vy*=0.984;

  if(b.y<b.r||b.y>H-b.r){ b.vy*=-0.8; b.y=Math.max(b.r,Math.min(H-b.r,b.y)); }

  const gh=H*0.3, gy=(H-gh)/2;
  if(b.x<b.r){
    if(b.y>gy&&b.y<gy+gh){ as++; document.getElementById('as').textContent=as; reset(); }
    else { b.vx*=-0.8; b.x=b.r; }
  }
  if(b.x>W-b.r){
    if(b.y>gy&&b.y<gy+gh){ ps++; document.getElementById('ps').textContent=ps; reset(); }
    else { b.vx*=-0.8; b.x=W-b.r; }
  }
}

function reset(){
  b.x=W/2; b.y=H/2; b.vx=(Math.random()>.5?1:-1)*4; b.vy=(Math.random()-.5)*3;
  pl.x=W*0.18; pl.y=H/2;
  ai.x=W*0.82; ai.y=H/2;
}
function restart(){ ps=0; as=0; document.getElementById('ps').textContent=0; document.getElementById('as').textContent=0; reset(); }

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
