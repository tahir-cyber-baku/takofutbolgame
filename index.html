<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Futbol Oyunu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; }
  body {
    background: #0b3d1f;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    overflow-x: hidden;
  }
  h1 { margin: 12px 0; font-size: 1.8rem; }
  #gameCanvas {
    background: #1a7a3a;
    border: 4px solid white;
    border-radius: 8px;
    display: block;
    max-width: 100%;
  }
  .info {
    display: flex;
    gap: 20px;
    margin: 12px 0;
  }
  .score {
    background: rgba(0,0,0,0.5);
    padding: 8px 20px;
    border-radius: 8px;
  }
  button {
    padding: 10px 25px;
    font-size: 1.1rem;
    background: #ffcc00;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
  }

  /* Mobil düymələr */
  #controls {
    display: none;
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    justify-content: space-around;
    align-items: flex-end;
    padding: 0 20px;
    pointer-events: none;
  }
  .dpad {
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px 60px;
    gap: 6px;
    pointer-events: auto;
  }
  .dpad button {
    width: 60px;
    height: 60px;
    border-radius: 12px;
    background: rgba(255,255,255,0.3);
    border: none;
    color: white;
    font-size: 24px;
  }
  .up { grid-column: 2; grid-row: 1; }
  .left { grid-column: 1; grid-row: 2; }
  .right { grid-column: 3; grid-row: 2; }
  .down { grid-column: 2; grid-row: 3; }
  .empty { visibility: hidden; }
  #kick {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #e53935;
    border: none;
    color: white;
    font-size: 18px;
    font-weight: bold;
    pointer-events: auto;
  }

  @media (max-width: 768px) {
    #controls { display: flex; }
    body { padding-bottom: 180px; }
  }
</style>
</head>
<body>

<h1>⚽ Futbol Oyunu</h1>
<canvas id="gameCanvas" width="800" height="450"></canvas>

<div class="info">
  <div class="score">Sən: <span id="pScore">0</span></div>
  <div class="score">Komputer: <span id="aScore">0</span></div>
</div>
<button onclick="restart()">Yenidən Başla</button>

<div id="controls">
  <div class="dpad">
    <div class="empty"></div>
    <button class="up" id="up">▲</button>
    <div class="empty"></div>
    <button class="left" id="left">◀️</button>
    <div class="empty"></div>
    <button class="right" id="right">▶️</button>
    <div class="empty"></div>
    <button class="down" id="down">▼</button>
    <div class="empty"></div>
  </div>
  <button id="kick">VUR</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W = canvas.width;
let H = canvas.height;

// Oyun obyektləri
let player = { x: 150, y: H/2, r: 18, speed: 5, color: '#1976d2' };
let ai     = { x: W-150, y: H/2, r: 18, speed: 3.5, color: '#d32f2f' };
let ball   = { x: W/2, y: H/2, r: 12, vx: 0, vy: 0 };

let pScore = 0;
let aScore = 0;
let keys = {};
let touch = { up: false, down: false, left: false, right: false, kick: false };

// Ölçünü uyğunlaşdır
function resize() {
  const maxW = Math.min(window.innerWidth - 20, 900);
  const ratio = 450 / 800;
  W = maxW;
  H = Math.floor(maxW * ratio);
  canvas.width = W;
  canvas.height = H;
  // Obyektləri yenidən yerləşdir
  player.x = W * 0.18;
  player.y = H / 2;
  ai.x = W * 0.82;
  ai.y = H / 2;
  ball.x = W / 2;
  ball.y = H / 2;
}
window.addEventListener('resize', resize);
resize();

// Klaviatura
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.code === 'Space') e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.key] = false);

// Mobil düymələr
['up','down','left','right'].forEach(dir => {
  const btn = document.getElementById(dir);
  btn.addEventListen
